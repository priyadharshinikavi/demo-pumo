<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You | PUMO TECHNOVATION</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .thankyou-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(13,110,253,0.05), rgba(0,194,255,0.05));
    }
    .thankyou-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(13, 110, 253, 0.15);
      border-radius: 28px;
      padding: 4rem 3rem;
      text-align: center;
      max-width: 600px;
      box-shadow: 0 25px 50px rgba(13, 110, 253, 0.1);
    }
    .check-icon {
      font-size: 5rem;
      color: #0D6EFD;
      margin-bottom: 1.5rem;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="page-fade">
  <div class="thankyou-wrap">
    <div class="thankyou-card">
      <div class="check-icon">✓</div>
      <h1 class="fw-extrabold mb-3" style="font-family: 'Poppins', sans-serif;">Thank You!</h1>
      <p class="lead text-muted mb-4">
        Your message has been successfully sent. Our team from PUMO Technovation will reach out to you shortly!
      </p>
      <a href="index.html" class="btn btn-glow pulse px-5 py-3 rounded-pill fw-bold">RETURN TO HOME</a>
    </div>
  </div>
</body>
</html>
