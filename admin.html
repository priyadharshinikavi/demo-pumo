<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard | PUMO TECHNOVATION</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .admin-header {
      background: linear-gradient(90deg, #0D6EFD, #00C2FF);
      color: white;
      padding: 2rem 0;
      margin-bottom: 3rem;
      box-shadow: 0 10px 30px rgba(13, 110, 253, 0.2);
    }
    .table-glass {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.05);
      border: 1px solid rgba(13, 110, 253, 0.1);
    }
    .table th {
      background: rgba(13, 110, 253, 0.05);
      font-weight: 600;
      color: #334155;
      border-bottom: 2px solid rgba(13, 110, 253, 0.1);
    }
    .table td {
      vertical-align: middle;
      color: #475569;
    }
  </style>
</head>
<body class="page-fade" style="background: #F8FAFC; min-height: 100vh;">

  <div class="admin-header text-center">
    <div class="container">
      <h1 class="fw-extrabold m-0" style="font-family: 'Poppins', sans-serif;">Admin Dashboard</h1>
      <p class="opacity-75 mt-2 mb-0">View all contact form registrations</p>
    </div>
  </div>

  <div class="container">
    <div class="table-glass">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th class="py-3 px-4">Date / Time</th>
              <th class="py-3 px-4">Name</th>
              <th class="py-3 px-4">Email</th>
              <th class="py-3 px-4">Phone</th>
              <th class="py-3 px-4">Interest</th>
              <th class="py-3 px-4">Message</th>
            </tr>
          </thead>
          <tbody id="contactsTableBody">
            <tr>
              <td colspan="6" class="text-center py-5 text-muted">Loading registrations...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      fetch('/api/admin/contacts')
        .then(response => response.json())
        .then(data => {
          const tbody = document.getElementById('contactsTableBody');
          if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">No registrations found yet.</td></tr>';
            return;
          }
          
          tbody.innerHTML = '';
          data.forEach(contact => {
            const date = new Date(contact.created_at).toLocaleString();
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="py-3 px-4 small text-muted">${date}</td>
              <td class="py-3 px-4 fw-medium text-dark">${contact.firstName} ${contact.lastName}</td>
              <td class="py-3 px-4"><a href="mailto:${contact.email}">${contact.email}</a></td>
              <td class="py-3 px-4">${contact.phone}</td>
              <td class="py-3 px-4"><span class="badge bg-primary bg-opacity-10 text-primary px-2 py-1 rounded-pill">${contact.interest}</span></td>
              <td class="py-3 px-4 small" style="max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${contact.message}">${contact.message}</td>
            `;
            tbody.appendChild(tr);
          });
        })
        .catch(err => {
          console.error('Error fetching contacts:', err);
          document.getElementById('contactsTableBody').innerHTML = '<tr><td colspan="6" class="text-center py-5 text-danger">Error loading data.</td></tr>';
        });
    });
  </script>
</body>
</html>
